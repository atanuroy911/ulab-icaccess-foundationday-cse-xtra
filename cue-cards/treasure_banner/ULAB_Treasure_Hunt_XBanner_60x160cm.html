<title>Treasure Hunt · ULAB 23rd Foundation Day · X-banner</title>

<style>
  @page { size: 60cm 160cm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 60cm; height: 160cm; overflow: hidden; }
  body { position: relative; overflow: hidden; font-family: Outfit, sans-serif; color: #4A2C12;
          -webkit-print-color-adjust: exact; print-color-adjust: exact;
          background: radial-gradient(95% 62% at 50% 38%, #F6E6BC 0%, #EBD29A 55%, #D9B070 100%); }
  .abs { position: absolute; }

  /* faint map grid + burnt-paper edges */
  .grid { inset: 0; opacity: .5;
           background-image: linear-gradient(rgba(107,62,22,.10) .08cm, transparent .08cm), linear-gradient(90deg, rgba(107,62,22,.10) .08cm, transparent .08cm);
           background-size: 6cm 6cm; }
  .burn { inset: 0; background: radial-gradient(120% 88% at 50% 45%, rgba(120,70,20,0) 55%, rgba(120,70,20,.42) 100%); }
  .frame { left: 2.4cm; right: 2.4cm; top: 2.4cm; bottom: 8.6cm; border: .3cm solid #4A2C12; border-radius: 1.4cm; }
  .frame2 { left: 3.4cm; right: 3.4cm; top: 3.4cm; bottom: 9.6cm; border: .1cm solid #4A2C12; border-radius: .8cm; opacity: .7; }

  /* ---- header ---- */
  .logo-panel { left: 8cm; right: 8cm; top: 6.2cm; height: 15cm; background: #fff; border: .3cm solid #4A2C12; border-radius: 2.6cm;
                 display: grid; place-items: center; box-shadow: 0 .45cm 0 rgba(74,44,18,.35); }
  .logo-panel img { height: 10.6cm; width: 29.02cm; display: block; }
  .rib-shadow, .rib { left: 4.5cm; right: 4.5cm; height: 7cm; clip-path: polygon(0 0, 100% 0, 96.5% 50%, 100% 100%, 0 100%, 3.5% 50%); }
  .rib-shadow { top: 24.9cm; background: #B98A00; }
  .rib { top: 24.1cm; background: #FDC300; display: flex; align-items: center; justify-content: center; gap: 1.2cm;
          font-family: Rye, serif; color: #4A2C12; }
  .rib .n { font-size: 4.6cm; line-height: 1; }
  .rib .n sup { font-size: 2.1cm; vertical-align: top; position: relative; top: .35cm; }
  .rib .t { font-family: Outfit, sans-serif; font-weight: 900; font-size: 2.3cm; line-height: 1.04; text-transform: uppercase; text-align: left; }

  /* ---- headline ---- */
  .headline { left: 0; right: 0; top: 33.6cm; text-align: center; font-family: Rye, serif; text-transform: uppercase; line-height: .94; }
  .headline .l1 { display: block; font-size: 8.9cm; color: #4A2C12; text-shadow: 0 .35cm 0 rgba(255,255,255,.55); }
  .headline .l2 { display: block; font-size: 15.4cm; color: #C8201A; margin-top: .2cm; text-shadow: .35cm .4cm 0 #4A2C12; }
  .tag { left: 4cm; right: 4cm; top: 61.2cm; text-align: center; font-weight: 800; font-size: 3.2cm; line-height: 1.1; }
  .tag b { color: #C8201A; font-weight: 900; }

  /* ---- map scene ---- */
  .scene { position: absolute; left: 0; top: 67cm; width: 60cm; height: 54cm; }

  /* ---- call to action + credit ---- */
  .cta { left: 4cm; right: 4cm; top: 127.0cm; height: 14.0cm; background: #04203F; border: .3cm solid #4A2C12; border-radius: 3.2cm;
          text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;
          box-shadow: 0 .5cm 0 rgba(74,44,18,.45); }
  .cta .big { font-family: Rye, serif; font-size: 4.25cm; line-height: 1.12; white-space: nowrap; text-transform: uppercase; color: #FDC300; }
  .cta .big span { color: #fff; }
  .credit { left: 11cm; right: 11cm; top: 143.4cm; height: 5.8cm; border-radius: 4cm; background: #FFF3D1;
             border: .3cm solid #4A2C12; display: flex; align-items: center; justify-content: center;
             font-weight: 900; font-size: 3.2cm; color: #04203F; white-space: nowrap; }
</style></head>
